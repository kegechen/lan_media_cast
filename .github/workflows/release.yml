name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - name: Verify release version
        shell: pwsh
        run: ./scripts/check-release-version.ps1 -Tag $env:GITHUB_REF_NAME
      - name: Require Android signing secrets
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $required = @(
            $env:ANDROID_KEYSTORE_BASE64,
            $env:ANDROID_KEYSTORE_PASSWORD,
            $env:ANDROID_KEY_ALIAS,
            $env:ANDROID_KEY_PASSWORD
          )
          if ($required.Where({ [string]::IsNullOrWhiteSpace($_) }).Count -gt 0) {
            throw 'Android release signing secrets are incomplete.'
          }
      - name: Materialize Android signing key
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'lan-media-cast-release.jks'
          [IO.File]::WriteAllBytes(
            $keyPath,
            [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          )
          "ANDROID_KEYSTORE_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test, lint and build receiver
        working-directory: receiver_android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
      - name: Analyze, test and build sender
        working-directory: sender_flutter
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release
      - name: Collect Android assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item receiver_android/app/build/outputs/apk/release/app-release.apk `
            "release-assets/LANMediaCast-Receiver-$version.apk"
          Copy-Item sender_flutter/build/app/outputs/flutter-apk/app-release.apk `
            "release-assets/LANMediaCast-Sender-$version.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: release-assets/*
          if-no-files-found: error

  windows:
    name: Windows Setup
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - name: Verify release version
        shell: pwsh
        run: ./scripts/check-release-version.ps1 -Tag $env:GITHUB_REF_NAME
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: dist/LANMediaCast-Sender-*-Setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release-assets"
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem release-assets -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $lines | Set-Content release-assets/SHA256SUMS.txt -Encoding ascii
      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          elif [[ "$GITHUB_REF_NAME" == "v1.0.0" ]]; then
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --title "LAN Media Cast 1.0.0" \
              --notes-file CHANGELOG.md
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --title "LAN Media Cast ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
